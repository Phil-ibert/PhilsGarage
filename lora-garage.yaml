# ===========================================================================
#  YAML du module dans le tableau de bord ESPHome de Home Assistant.
#
#  Le plus simple : crée l'appareil avec l'assistant ESPHome (« + Nouvel
#  appareil »), garde ce qu'il a généré (esphome, esp32, api, ota, wifi,
#  captive_portal) et ajoute-lui les blocs `substitutions:` et `packages:`
#  ci-dessous. Ou copie ce fichier entier à la place.
#
#  La passerelle (entités, radio, composant phils_lora) est téléchargée depuis
#  GitHub ; ton fichier reste maître de tout ce qu'il définit lui-même.
# ===========================================================================

esphome:
  name: lora-garage
  friendly_name: Garage LoRa

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret lora_garage_api_key

ota:
  - platform: esphome
    encryption:     # chiffrée avec la clé de l'API

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Lora-Garage Fallback Hotspot"
    password: !secret lora_garage_ap_password

captive_portal:

# --------------------------- Passerelle LoRa -------------------------------
substitutions:
  # Fréquence à laquelle ESPHome relit le dépôt GitHub ; 0s pour forcer
  # la prise en compte d'un push, puis remets 1d.
  philsgarage_refresh: 1d

  # Surcharges éventuelles (voir packages/radio/<puce>.yaml pour la liste) :
  # lora_cs_pin: GPIO18
  # lora_dio0_pin: GPIO26
  # lora_tx_power: "17"
  # philsgarage_components: github://Phil-ibert/PhilsGarage@dev   # autre branche

packages:
  philsgarage:
    url: https://github.com/Phil-ibert/PhilsGarage
    ref: main
    refresh: ${philsgarage_refresh}
    files:
      - packages/lora-garage.yaml
      # Puce Semtech : sx127x.yaml (SX1276/78, Ra-02, RFM9x) ou sx126x.yaml (SX1262/68, E22)
      - packages/radio/sx127x.yaml
