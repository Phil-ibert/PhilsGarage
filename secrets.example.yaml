# À fusionner dans TON secrets.yaml ESPHome (ne remplace pas le fichier
# existant, ajoute juste les clés manquantes).

# Indispensable : clé AES-256 partagée avec l'émetteur Arduino, copie EXACTE de
# aes_key[32] dans libraries/PhilsCrypto/PhilsCryptoLoRa.h
# (le format "0x.., 0x.., ..." du tableau C est accepté).
phils_lora_aes_key: "REMPLACER_PAR_LES_32_OCTETS_DE_aes_key"

# Utilisés seulement par le lora-garage.yaml d'exemple de ce dépôt. Si tu as
# créé l'appareil avec l'assistant ESPHome, il a déjà mis ses propres valeurs.
wifi_ssid: "MON_SSID"
wifi_password: "MON_MOT_DE_PASSE_WIFI"
lora_garage_api_key: "REMPLACER_PAR_UNE_CLE_BASE64_DE_32_OCTETS="
lora_garage_ap_password: "REMPLACER"
