# À fusionner dans TON secrets.yaml ESPHome (ne remplace pas le fichier
# existant si tu en as déjà un, ajoute juste les clés manquantes).

wifi_ssid: "MON_SSID"
wifi_password: "MON_MOT_DE_PASSE_WIFI"

# Clé de chiffrement de l'API native (32 octets en base64).
# Génère la tienne : https://esphome.io/components/api/  (ou laisse le dashboard
# ESPHome en créer une), puis colle-la ici.
lora_garage_api_key: "REMPLACER_PAR_UNE_CLE_BASE64_DE_32_OCTETS="
lora_garage_ap_password: "REMPLACER"

# Clé AES-256 partagée avec l'émetteur Arduino : copie EXACTE de aes_key[32]
# dans libraries/PhilsCrypto/PhilsCryptoLoRa.h (le format "0x.., 0x.., ..." du tableau C est accepté).
phils_lora_aes_key: "REMPLACER_PAR_LES_32_OCTETS_DE_aes_key"
